name: aur-updates
on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to check (empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-aur:
    runs-on: ubuntu-latest
    container: archlinux:latest  # aur-sync.sh needs makepkg --printsrcinfo
    steps:
      - name: prepare
        run: pacman -Syu --noconfirm --needed git github-cli curl jq

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check aur updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/aur-sync.sh "${{ inputs.package }}"
